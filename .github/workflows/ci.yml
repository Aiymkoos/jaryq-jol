name: Validate and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test webapp/tests/*.test.js
      - run: npm run build --prefix webapp
      - uses: actions/upload-artifact@v4
        with:
          name: jaryq-jol-web
          path: webapp/dist
